name: Task
description: A piece of work (content, structure, tooling)
title: "<type>(<scope>): <short description>"
labels: ["docs"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done, and why does it matter?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Git handbook
        - Glossary and term chains
        - Templates
        - Top 10 and tools stack
        - Practice exercises
        - Repository tooling
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Break the work into small steps.
      value: |
        - [ ]
        - [ ]
  - type: textarea
    id: done
    attributes:
      label: Definition of Done
      value: |
        - [ ] Changes merged via PR
        - [ ] Links and anchors resolve
        - [ ] pre-commit passes
  - type: textarea
    id: notes
    attributes:
      label: Notes / references
